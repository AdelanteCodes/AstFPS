name: Compare released Xe-Mod in Minecraft
on:
  push:
    branches: [main]
    paths: ['benchmarks/**', '.github/workflows/benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xe-mod-cloud-comparison
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers libgl1-mesa-dri
      - name: Download the published prototype
        run: |
          mkdir -p benchmark-artifact
          cd benchmark-artifact
          curl --fail --location --retry 3 --output xe-mod-0.1.0-alpha.1.jar https://github.com/KyzerGoated/Xe-Mod/releases/download/v0.1.0-alpha.1/xe-mod-0.1.0-alpha.1.jar
          curl --fail --location --retry 3 --output SHA256SUMS.txt https://github.com/KyzerGoated/Xe-Mod/releases/download/v0.1.0-alpha.1/SHA256SUMS.txt
          grep '  xe-mod-0.1.0-alpha.1.jar$' SHA256SUMS.txt | sha256sum --check
          lscpu > cpu.txt
      - name: Run baseline, default, and enabled comparisons on the same machine
        shell: bash
        run: |
          chmod +x gradlew
          for repetition in 1 2 3; do
            if [ "$repetition" = 2 ]; then modes='memo default baseline'; else modes='baseline default memo'; fi
            for mode in $modes; do
              directory="run-${mode}-${repetition}"
              mkdir -p "benchmarks/client/$directory/mods"
              if [ "$mode" != baseline ]; then
                cp benchmark-artifact/xe-mod-0.1.0-alpha.1.jar "benchmarks/client/$directory/mods/"
              fi
              xvfb-run -a --server-args='-screen 0 2560x1440x24' ./gradlew --no-daemon -p benchmarks/client runClient -PbenchmarkMode="$mode" -PbenchmarkRunDirectory="$directory" 2>&1 | tee "benchmark-artifact/${mode}-${repetition}.log"
              cp "benchmarks/client/$directory/benchmark-result.json" "benchmark-artifact/${mode}-${repetition}.json"
            done
          done
          python3 benchmarks/compare.py benchmark-artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xe-mod-cloud-comparison
          path: |
            benchmark-artifact/
            benchmarks/client/run-*/screenshots/
            benchmarks/client/run-*/crash-reports/
            benchmarks/client/run-*/logs/
          if-no-files-found: error
