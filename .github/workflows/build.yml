name: Build experimental Xe-Mod
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: xe-mod-original-prototype
          path: build/libs/*.jar
          if-no-files-found: error
