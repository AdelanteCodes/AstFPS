name: Publish AstFPS prerelease
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: astfps-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify the committed artifacts
        shell: bash
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          cd artifacts
          sha256sum --check "SHA256SUMS-$version.txt"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'Release already published; preserving its assets.'
            exit 0
          fi
          gh release create "v$VERSION" "artifacts/AstFPS-$VERSION.jar" \
            "artifacts/AstFPS-$VERSION-sources.jar" "artifacts/SHA256SUMS-$VERSION.txt" \
            --target "$GITHUB_SHA" --title "AstFPS $VERSION" \
            --notes-file README.md --prerelease
