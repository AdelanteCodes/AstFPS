name: Publish AstFPS release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: astfps-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
      - name: Build and verify release artifacts
        shell: bash
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ./gradlew clean test coreChecks build --no-daemon
          python scripts/package_release.py
          test -f "build/release/AstFPS-$version.jar"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'Release already published; preserving its assets.'
            exit 0
          fi
          gh release create "v$VERSION" "build/release/AstFPS-$VERSION.jar" \
            --target "$GITHUB_SHA" --title "AstFPS $VERSION" \
            --notes-file CHANGELOG.md --latest
