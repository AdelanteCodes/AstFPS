plugins { id 'net.fabricmc.fabric-loom' version '1.18.4' }
version = '1.0.0'
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.162.0+26.3'
}
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
loom {
    mods { 'xe_benchmark' { sourceSet sourceSets.main } }
    runs {
        client {
            client()
            runDir project.findProperty('benchmarkRunDirectory') ?: 'run'
            vmArgs '-Xmx3G'
            property 'xe.benchmark.mode', project.findProperty('benchmarkMode') ?: 'baseline'
            programArgs '--width', '2560', '--height', '1440'
        }
    }
}
